name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format - lint - tests - smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: Format check
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Tests (fictional fixtures only, no raw dataset)
        run: uv run pytest
      - name: Smoke (fictional fixture, no raw dataset)
        run: uv run nfl-showcase smoke
